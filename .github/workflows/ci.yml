name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  analytics:
    name: Analytics (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: analytics
        run: uv sync --group dev

      - name: Lint
        working-directory: analytics
        run: uv run ruff check .

      - name: Test
        working-directory: analytics
        run: uv run pytest

  migrations:
    name: Flyway migrations on PostgreSQL 18
    runs-on: ubuntu-latest
    # The backend test suite runs on H2 in PostgreSQL compatibility mode, so
    # the migrations themselves are only exercised here, against a real server.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: autocare
          POSTGRES_USER: autocare
          POSTGRES_PASSWORD: autocare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autocare -d autocare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package the application
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress -DskipTests package

      - name: Boot against PostgreSQL and verify readiness
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/autocare
          DATABASE_USERNAME: autocare
          DATABASE_PASSWORD: autocare
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          COOKIE_SECURE: 'false'
        run: |
          set -euo pipefail
          # Flyway applies every migration on startup, and ddl-auto=validate
          # then checks the JPA mappings against the migrated schema, so a
          # successful boot proves both are in sync.
          java -jar target/backend-*.jar > boot.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null 2>&1; then
              echo "Application became ready after ${attempt}s."
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::The application exited before becoming ready."
              cat boot.log
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::Timed out waiting for readiness."
              cat boot.log
              exit 1
            fi
            sleep 1
          done

      - name: Confirm the applied migration history
        run: |
          set -euo pipefail
          PGPASSWORD=autocare psql -h localhost -U autocare -d autocare \
            -c 'select version, description, success from flyway_schema_history order by installed_rank;'
          # Fail if any migration was recorded as unsuccessful.
          failed=$(PGPASSWORD=autocare psql -h localhost -U autocare -d autocare -tAc \
            'select count(*) from flyway_schema_history where success = false;')
          test "$failed" = "0"

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build analytics image
        uses: docker/build-push-action@v6
        with:
          context: ./analytics
          push: false
          cache-from: type=gha,scope=analytics
          cache-to: type=gha,scope=analytics,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Validate the compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
