spring:
  application:
    name: autocare-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/autocare}
    username: ${DATABASE_USERNAME:autocare}
    password: ${DATABASE_PASSWORD:autocare}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

autocare:
  jwt:
    # HMAC-SHA256 signing key; must be at least 32 bytes. The application
    # refuses to start when it is missing so a production deploy can never
    # silently fall back to a well-known key.
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  cookie:
    # Refresh-token cookie is Secure by default; local HTTP development
    # overrides this through COOKIE_SECURE=false (see docs/SECURITY.md).
    secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  analytics:
    base-url: ${ANALYTICS_BASE_URL:http://localhost:8000}
    internal-token: ${ANALYTICS_INTERNAL_TOKEN:}
    timeout: ${ANALYTICS_TIMEOUT:5s}
