name: autocare

# Full local stack: PostgreSQL, the Java API, the Python analytics service and
# the SPA behind nginx. Copy .env.example to .env before the first run.
#
#   cp .env.example .env && docker compose up --build
#
# The app is then served on http://localhost:8081.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: autocare
      POSTGRES_USER: autocare
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-autocare}
    ports:
      # Published on 5433 because 5432 is usually taken by a PostgreSQL
      # installed directly on the host.
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autocare -d autocare']
      interval: 10s
      timeout: 5s
      retries: 10

  analytics:
    build: ./analytics
    environment:
      ANALYTICS_INTERNAL_TOKEN: ${ANALYTICS_INTERNAL_TOKEN:?required, see .env.example}
    # Deliberately not published to the host: the browser never talks to the
    # analytics service, only the backend does.
    expose:
      - '8000'
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      # The demo profile seeds a fictional account on first boot. Set
      # SPRING_PROFILES_ACTIVE to an empty value for a clean database.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-demo}
      DATABASE_URL: jdbc:postgresql://db:5432/autocare
      DATABASE_USERNAME: autocare
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-autocare}
      JWT_SECRET: ${JWT_SECRET:?required, at least 32 bytes, see .env.example}
      # The stack is served over plain HTTP on localhost, so the refresh
      # cookie cannot carry the Secure flag here. Keep it true in production.
      COOKIE_SECURE: 'false'
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      ANALYTICS_BASE_URL: http://analytics:8000
      ANALYTICS_INTERNAL_TOKEN: ${ANALYTICS_INTERNAL_TOKEN:?required, see .env.example}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-DemoAutoCare123}
    ports:
      - '8080:8080'
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8081:80'
    restart: unless-stopped

volumes:
  db-data:
