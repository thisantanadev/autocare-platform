server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API is proxied through the same origin as the SPA. That keeps the
    # HttpOnly refresh cookie first-party, exactly like the Vite dev proxy,
    # so no cross-site cookie handling is needed in production either.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Client-side routing: unknown paths must return index.html, never a 404,
    # or a refresh on /app/vehicles would break.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, otherwise a deploy would keep
    # serving references to asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
